<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopHub — Homepage Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: "#131921",
              navylight: "#232f3e",
              amazonorange: "#FF9900",
              accent: "#febd69",
              link: "#007185",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @media (max-width: 768px) {
        #search-extra {
          display: none;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <!-- navbar -->
    <nav
      class="flex w-full items-center bg-navy text-white h-16 flex-wrap md:flex-nowrap"
    >
      <!-- Logo -->
      <div
        class="px-4 border border-navy hover:border-white transition-colors mr-1"
      >
        <a href="#"
          ><img src="src/amazon-white1.svg" alt="amazon" class="h-16 w-28"
        /></a>
      </div>

      <!-- Location - hidden on small screens -->
      <div class="hidden lg:block border border-navy hover:border-white">
        <a href="#" class="grid grid-cols-[auto_1fr] items-center gap-x-2"
          ><img
            src="src/location-white.svg"
            alt="loc"
            class="h-7 w-5 row-span-2 pt-2"
          />
          <div class="grid">
            <span class="text-gray-400 text-xs pt-3"
              >Delivering to Kozhikode 673611</span
            >
            <span class="text-white font-semibold text-sm"
              >Update location</span
            >
          </div></a
        >
      </div>

      <!-- Search bar - always visible, shrinks to fill available space -->
      <div
        class="flex flex-1 min-w-0 h-10 mx-2 my-3 rounded-md overflow-hidden"
      >
        <select
          class="hidden sm:block w-14 bg-gray-100 text-gray-600 text-sm px-2 border-r border-gray-300 focus:outline-none rounded-l-md hover:bg-gray-300 hover:text-gray-900 hover:cursor-pointer"
        >
          <option>All</option>
          <option>Electronics</option>
          <option>Fashion</option>
          <option>Books</option>
        </select>

        <input
          type="text"
          placeholder="Search Amazon.in"
          class="flex-1 min-w-0 px-3 py-2 text-sm text-gray-800 focus:outline-none sm:rounded-none rounded-l-md"
        />

        <button
          class="bg-amber-400 hover:bg-amber-500 px-4 flex items-center justify-center rounded-r-md transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-gray-900"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
            />
          </svg>
        </button>
      </div>

      <div class="hidden md:flex flex-row items-center">
        <!-- Language selector - hidden below md -->
        <div
          class="hidden lg:flex flex-row items-center py-3 px-1 gap-1 border border-navy hover:border-white transition-colors overflow-hidden"
        >
          <img src="src/India.svg" alt="india" class="w-5" />
          <select
            class="bg-navy text-white font-semibold text-sm focus:outline-none cursor-pointer"
          >
            <option>EN</option>
            <option>HI</option>
            <option>TA</option>
            <option>TE</option>
            <option>ML</option>
            <option>BN</option>
            <option>MR</option>
          </select>
        </div>

        <!-- Sign in - hidden on small views -->
        <div
          class="group py-1 relative flex flex-col px-1 border border-navy hover:border-white transition-colors mr-1 cursor-pointer"
        >
          <span class="text-xs text-white">Hello, sign in</span>
          <span class="text-sm font-bold text-white">Accounts & lists</span>

          <div
            class="absolute top-full left-1/2 -translate-x-1/2 mt-2 px-10 py-3 bg-white text-xs font-semibold rounded-md whitespace-nowrap opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50"
          >
            <button
              class="bg-amber-400 hover:bg-amber-500 px-4 py-2 flex items-center justify-center rounded-md transition-colors"
            >
              Sign in
            </button>
          </div>
        </div>

        <!-- Orders - hidden on small views -->
        <div
          class="group py-1 relative flex flex-col px-1 border border-navy hover:border-white transition-colors mr-1 cursor-pointer"
        >
          <span class="text-xs text-white">Returns</span>
          <span class="text-sm font-bold text-white">& Orders</span>

          <div
            class="absolute top-full left-1/2 -translate-x-1/2 mt-2 px-10 py-3 bg-white text-xs font-semibold rounded-md whitespace-nowrap opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50"
          >
            <button
              class="bg-amber-400 hover:bg-amber-500 px-4 py-2 flex items-center justify-center rounded-md transition-colors"
            >
              Sign in
            </button>
          </div>
        </div>
      </div>

      <!-- Cart - always visible -->
      <div
        class="relative flex items-center px-4 border border-navy hover:border-white transition-colors mr-1"
      >
        <img src="src/cart.svg" alt="" class="w-10" />
        <div class="fixed top-3 right-8">
          <span class="text-amazonorange text-lg font-bold">0</span>
        </div>
      </div>
    </nav>
    <!-- the secondary navbar -->
    <nav class="flex justify-between bg-navylight h-auto text-white">
      <div class="h-auto flex items-center gap-2 text-size-xs">
        <div
          class="py-2 px-1 border border-navylight hover:border-white transition-colors mr-1 cursor-pointer"
        >
          <button class="flex items-center justify-center mr-1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-white"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
            All
          </button>
        </div>
        <a
          href="#"
          class="hidden md:flex py-2 px-1 border border-navylight hover:border-white transition-colors mr-1 cursor-pointer"
        >
          Fresh
        </a>
        <a
          href="#"
          class="py-2 px-1 border border-navylight hover:border-white transition-colors mr-1 cursor-pointer"
        >
          Prime Video
        </a>
        <a
          href="#"
          class="hidden md:flex py-2 px-1 border border-navylight hover:border-white transition-colors mr-1 cursor-pointer"
        >
          Sell
        </a>
        <a
          href="#"
          class="hidden md:flex py-2 px-1 border border-navylight hover:border-white transition-colors mr-1 cursor-pointer"
        >
          Bestsellers
        </a>
        <a
          href="#"
          class="py-2 px-1 border border-navylight hover:border-white transition-colors mr-1 cursor-pointer"
        >
          Today's deals
        </a>
        <a
          href="#"
          class="hidden md:flex py-2 px-1 border border-navylight hover:border-white transition-colors mr-1 cursor-pointer"
        >
          Mobiles
        </a>
      </div>
      <div class="flex justify-between border border-navylight hover:border-white transition-colors cursor-pointer">
        <div class="flex items-center p-1">
          <div class="bg-white rounded-full pt-2 p-1">
            <img src="src/bus-icon.svg" alt="bus" class="h-5 w-6" />
          </div>
          <span class="py-1 text-xl font-bold"
            >Up to 17% off on bus tickets</span
          >
        </div>
        <div class="bg-amber-400 flex items-center pl-4 pr-2 rounded-l-full">
          <img src="src/amazon-pay.svg" alt="pay logo" class="h-8 w-8" />
        </div>
      </div>
    </nav>
    <div class="bg-[#3a4758] p-1  flex lg:hidden group">
      <a href="#" class="flex items-center gap-2 px-2 border border-[#3a4758] hover:border-white"
          ><img
            src="src/location-white.svg"
            alt="loc"
            class="h-7 w-5"
          />
          <div class="flex gap-3">
            <span class="text-white text-xs underline group-hover:text-gray-400"
              >Delivering to Kozhikode 673611</span
            >
            <span class="text-white font-semibold text-sm"
              >Update location</span
            >
          </div></a
        >
    </div>
  </body>
</html>
